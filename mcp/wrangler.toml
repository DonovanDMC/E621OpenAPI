name = "e621-mcp-server"
main = "src/index.ts"
compatibility_date = "2025-03-10"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

[[routes]]
pattern = "mcp.e621.wiki"
custom_domain = true

# Path-scoped route on the existing e621.wiki zone — only /mcp* is handled by this
# Worker; the rest of e621.wiki keeps being served by whatever already serves it.
[[routes]]
pattern = "e621.wiki/mcp*"
zone_name = "e621.wiki"

# Protected resource metadata for e621.wiki/mcp, which points clients at mcp.e621.wiki for OAuth.
[[routes]]
pattern = "e621.wiki/.well-known/oauth-protected-resource/mcp*"
zone_name = "e621.wiki"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["E621MCP"]

[[durable_objects.bindings]]
class_name = "E621MCP"
name = "MCP_OBJECT"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "897d39b6060c4ceda796c686f98cc8b6"

[vars]
E621_API_BASE = "https://e621.net"
E621_USER_AGENT = "e621-mcp-server/0.1 (by DonovanDMC; https://e621.wiki)"

[secrets]
required = ["E621_OAUTH_CLIENT_ID", "E621_OAUTH_CLIENT_SECRET", "E621_PROXY_BASE", "E621_PROXY_TOKEN"]

[observability.traces]
enabled = true
destinations = ["yiff-space-otel-traces"]

[observability.logs]
enabled = true
destinations = ["yiff-space-otel-logs"]
