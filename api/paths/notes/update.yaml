summary: Update Note
operationId: notes#update
tags:
- Notes
security:
- basicAuth: []
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          note[x]:
            type: integer
          note[y]:
            type: integer
          note[width]:
            type: integer
          note[height]:
            type: integer
          note[body]:
            type: string
responses:
  204:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
