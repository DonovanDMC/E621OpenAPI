summary: Update Blip
operationId: blips#update
tags:
- Blips
security:
- basicAuth: []
description: Unless Admin+, blips cannot be edited after 5 minutes. Marked blips cannot
  be edited.
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          blip[body]:
            type: string
responses:
  204:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
