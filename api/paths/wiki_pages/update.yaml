summary: Update Wiki Page
operationId: wiki_pages#update
tags:
- Wiki Pages
security:
- basicAuth: []
description: You must be Staff+ if the wiki page is locked.
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
  required: true
  description: The ID of the wiki page.
  schema:
    type: integer
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          wiki_page[body]:
            type: string
          wiki_page[edit_reason]:
            type: string
          wiki_page[parent]:
            type: string
            description: Must be Privileged+ to use.
          wiki_page[title]:
            type: string
            description: Must be Staff+ to use.
          wiki_page[is_locked]:
            type: boolean
            description: Must be Staff+ to use.
          wiki_page[is_deleted]:
            type: boolean
            description: Must be Staff+ to use.
          wiki_page[skip_secondary_validations]:
            type: boolean
            description: Must be Staff+ to use.
          wiki_page[category_id]:
            "$ref": "../../components/schemas/enums/TagCategory.yml"
          wiki_page[category_is_locked]:
            type: boolean
            description: Must be Admin+ to use.
          wiki_page[featured_posts_string]:
            type: string
            description: Space separated
responses:
  204:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
