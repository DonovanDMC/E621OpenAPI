summary: Count Matching Posts
operationId: takedowns#count_matching_posts
tags:
- Takedowns
security:
- basicAuth: []
description: You must have the bd staff user flag. Deleted posts are not counted.
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - post_tags
        properties:
          post_tags:
            description: See [Search Syntax](https://e621.wiki/searching/).
            type: string
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: object
          required:
          - matched_post_count
          properties:
            matched_post_count:
              type: integer
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
