summary: Update Tag Implication
operationId: tag_implications#update
tags:
- Tag Implications
security:
- basicAuth: []
description: You must be Admin+.
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          tag_implication[antecedent_name]:
            type: string
          tag_implication[consequent_name]:
            type: string
          tag_implication[forum_topic_id]:
            type: string
responses:
  204:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
