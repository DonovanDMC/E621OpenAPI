summary: Posts Index
operationId: posts#index
tags:
  - Posts
parameters:
  - $ref: "../../components/parameters/query/limit.yaml"
  - $ref: "../../components/parameters/query/page.yaml"
  - $ref: "../../components/parameters/query/v1.yaml"
  - $ref: "../../components/parameters/query/mode.yaml"
  - in: query
    name: tags
    description: See [Search Syntax](https://e621.wiki/searching/).
    schema:
      type: string
  - in: query
    name: md5
    schema:
      type: string
  - in: query
    name: random
    schema:
      type: string
responses:
  200:
    description: |
      Success
      Open the schema and find the schema for the mode being used.
    content:
      application/json:
        schema:
          oneOf:
            - type: array
              description: The basic format, returned by default, or with `mode=basic`.
              items:
                $ref: "../../components/schemas/models/BasicPost.yml"
            - type: array
              description: The extended format, returned with `mode=extended`.
              items:
                $ref: "../../components/schemas/models/ExtendedPost.yml"
            - type: array
              description: The thumbnail format, returned with `mode=thumbnail`.
              items:
                $ref: "../../components/schemas/models/ThumbnailPost.yml"
            - allOf:
                - $ref: "../../components/schemas/models/BasicPost.yml"
                - description: |
                    When searching by md5.
                    The basic format, returned by default, or with `mode=basic`.
            - allOf:
                - $ref: "../../components/schemas/models/ExtendedPost.yml"
                - description: |
                    When searching by md5.
                    The extended format, returned with `mode=extended`.
            - allOf:
                - $ref: "../../components/schemas/models/ThumbnailPost.yml"
                - description: |
                    When searching by md5.
                    The thumbnail format, returned with `mode=thumbnail`.
            - type: object
              description: The legacy format, returned with `v1=true`. This format is deprecated.
              required:
                - posts
              properties:
                posts:
                  type: array
                  items:
                    $ref: "../../components/schemas/models/LegacyPost.yml"
            - type: object
              description: |
                When searching by md5.
                The legacy format, returned with `v1=true`. This format is deprecated.
              required:
                - post
              properties:
                post:
                  $ref: "../../components/schemas/models/LegacyPost.yml"
  422:
    description: The search is invalid, has too many tags, timed out, or is too complex to process. See [Search Syntax](https://e621.wiki/searching/).
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/responses/MessageErrorResponse.yml"
