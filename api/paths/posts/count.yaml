summary: Count Posts
operationId: posts#count
tags:
  - Posts
parameters:
  - in: query
    name: tags
    description: See [Search Syntax](https://e621.wiki/searching/).
    required: true
    schema:
      type: string
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: object
          required:
            - count
            - capped
          properties:
            count:
              type: integer
            capped:
              type: boolean
  400:
    $ref: "../../components/responses/messageError.yaml"
