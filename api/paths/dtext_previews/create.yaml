summary: Preview DText
operationId: dtext_previews#create
tags:
- DText
description: Limited to 20 requests per minute.
security:
- basicAuth: []
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - body
        properties:
          body:
            type: string
            maxLength: 250000
          allow_color:
            type: boolean
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/responses/DTextResponse.yml"
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  413:
    description: The body or the rendered output is too large
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/responses/MessageErrorResponse.yml"
  429:
    description: Ratelimited
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/responses/MessageErrorResponse.yml"
