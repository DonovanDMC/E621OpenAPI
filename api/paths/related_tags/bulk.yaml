summary: List Bulk Related Tags
operationId: related_tags#bulk
tags:
- Related Tags
security:
- basicAuth: []
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          query:
            type: string
          category_id:
            "$ref": "../../components/schemas/enums/TagCategory.yml"
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/models/BulkRelatedTag.yml"
          example:
          - male:
            - name: male
              count: 0
              category_id: 0
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
