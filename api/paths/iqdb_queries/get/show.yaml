summary: Query IQDB
operationId: iqdb_queries#show
tags:
  - IQDB
parameters:
  - $ref: "../../../components/parameters/query/v2.yaml"
  - name: search[score_cutoff]
    in: query
    schema:
      type: integer
  - name: search[url]
    in: query
    schema:
      type: string
  - name: search[post_id]
    in: query
    schema:
      type: integer
  - name: search[hash]
    in: query
    schema:
      type: string
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          oneOf:
            - type: array
              description: The legacy format, returned by default. This format is deprecated.
              items:
                $ref: "../../../components/schemas/responses/IQDBResponse.yml"
            - type: array
              description: The new format, returned with `v2=true`.
              items:
                $ref: "../../../components/schemas/responses/IQDBResponseV2.yml"
  400:
    description: Invalid input, or IQDB is disabled
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/responses/MessageErrorResponse.yml"
  403:
    $ref: "../../../components/responses/accessDenied.yaml"
  422:
    description: The file could not be downloaded, or is too large
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/responses/MessageErrorResponse.yml"
  429:
    description: Ratelimited, or IQDB is busy
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/responses/MessageErrorResponse.yml"
  503:
    description: IQDB is unavailable
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/responses/MessageErrorResponse.yml"
