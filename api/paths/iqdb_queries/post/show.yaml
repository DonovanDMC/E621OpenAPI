summary: Query IQDB
operationId: iqdb_queries#show_post
tags:
  - IQDB
parameters:
  - $ref: "../../../components/parameters/query/v1.yaml"
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          search[file]:
            type: string
            format: binary
          search[score_cutoff]:
            type: integer
          search[url]:
            type: string
          search[post_id]:
            type: string
          search[hash]:
            type: string
    application/json:
      schema:
        type: object
        properties:
          score_cutoff:
            type: number
          url:
            type: string
          post_id:
            type: string
          hash:
            type: string
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          oneOf:
            - type: array
              description: The new format, returned by default.
              items:
                $ref: "../../../components/schemas/responses/IQDBResponseV2.yml"
            - type: array
              description: The legacy format, returned with `v1=true`. This format is deprecated.
              items:
                $ref: "../../../components/schemas/responses/IQDBResponse.yml"
  400:
    description: Invalid input, or IQDB is disabled
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/responses/MessageErrorResponse.yml"
  403:
    $ref: "../../../components/responses/accessDenied.yaml"
  422:
    description: The file could not be downloaded, or is too large
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/responses/MessageErrorResponse.yml"
  429:
    description: Ratelimited, or IQDB is busy
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/responses/MessageErrorResponse.yml"
  503:
    description: IQDB is unavailable
    content:
      application/json:
        schema:
          $ref: "../../../components/schemas/responses/MessageErrorResponse.yml"
