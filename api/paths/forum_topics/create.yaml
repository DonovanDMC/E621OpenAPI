summary: Create Forum Topic
operationId: forum_topics#create
tags:
  - Forum Topics
security:
  - basicAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - title
          - category_id
          - original_post_attributes
        properties:
          title:
            type: string
          category_id:
            type: integer
          is_sticky:
            type: boolean
            description: You must be Moderator+.
          is_locked:
            type: boolean
            description: You must be Moderator+.
          original_post_attributes:
            type: object
            properties:
              id:
                type: integer
                description: Forum post ID. Mutually exclusive with body, one must be provided.
              body:
                type: string
                description: First forum post body. Mutually exclusive with id, one must be provided.

responses:
  201:
    description: Success
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/models/ForumTopic.yml"
  403:
    $ref: "../../components/responses/accessDenied.yaml"
  422:
    $ref: "../../components/responses/expectedError.yaml"
