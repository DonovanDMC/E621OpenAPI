summary: Update Forum Topic
operationId: forum_topics#update
tags:
- Forum Topics
security:
- basicAuth: []
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          forum_topic[title]:
            type: string
          forum_topic[category_id]:
            type: integer
          forum_topic[is_sticky]:
            type: boolean
            description: You must be Moderator+.
          forum_topic[is_locked]:
            type: boolean
            description: You must be Moderator+.
          forum_topic[original_post_attributes][id]:
            type: integer
            description: Forum post ID. Silently ignored
          forum_topic[original_post_attributes][body]:
            type: string
            description: First forum post body.
responses:
  204:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
