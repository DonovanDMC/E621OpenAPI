summary: Forum Topics Index
operationId: forum_topics#index
tags:
  - Forum Topics
parameters:
  - $ref: "../../components/parameters/query/limit.yaml"
  - $ref: "../../components/parameters/query/page.yaml"
  - $ref: "../../components/parameters/query/id.yaml"
  - name: search[order]
    in: query
    description: "`sticky` sorts by last bumped, `sticky_updated` by last updated."
    schema:
      type: string
      enum:
        - id_asc
        - id_desc
        - sticky
        - sticky_updated
        - created_at
        - created_at_desc
        - created_at_asc
        - updated_at
        - updated_at_desc
        - updated_at_asc
        - bumped
  - in: query
    name: search[title]
    schema:
      type: string
  - in: query
    name: search[title_matches]
    schema:
      type: string
  - in: query
    name: search[category_id]
    schema:
      type: integer
  - in: query
    name: search[is_sticky]
    schema:
      type: boolean
  - in: query
    name: search[is_locked]
    schema:
      type: boolean
  - in: query
    name: search[is_hidden]
    schema:
      type: boolean
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../components/schemas/models/ForumTopic.yml"
