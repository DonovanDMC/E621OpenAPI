summary: Post Versions Index
operationId: post_versions#index
tags:
  - Post Versions
parameters:
  - $ref: "../../components/parameters/query/limit.yaml"
  - name: page
    in: query
    description: |
      A page number between 1 and 750, or `b<id>`/`a<id>` for the results before or after an id.
      Page numbers can only reach the 10,000 most recent results, use `b<id>` to go further.
      See [Pagination](https://e621.wiki/pagination/).
    schema:
      type: string
      pattern: ^([1-9]\d*|[ab]\d+)$
  - $ref: "../../components/parameters/query/id.yaml"
  - in: query
    name: search[updater_name]
    schema:
      type: string
  - in: query
    name: search[updater_id]
    schema:
      type: integer
  - in: query
    name: search[post_id]
    schema:
      type: integer
  - in: query
    name: search[start_id]
    schema:
      type: integer
  - in: query
    name: search[rating]
    schema:
      $ref: "../../components/schemas/enums/Rating.yml"
  - in: query
    name: search[rating_changed]
    schema:
      type: string
      enum:
        - e
        - q
        - s
        - any
  - in: query
    name: search[parent_id]
    schema:
      type: integer
  - in: query
    name: search[parent_id_changed]
    schema:
      type: boolean
  - in: query
    name: search[tags]
    schema:
      type: string
  - in: query
    name: search[tags_removed]
    schema:
      type: string
  - in: query
    name: search[tags_added]
    schema:
      type: string
  - in: query
    name: search[locked_tags]
    schema:
      type: string
  - in: query
    name: search[locked_tags_removed]
    schema:
      type: string
  - in: query
    name: search[locked_tags_added]
    schema:
      type: string
  - in: query
    name: search[reason]
    schema:
      type: string
  - in: query
    name: search[description]
    schema:
      type: string
  - in: query
    name: search[description_changed]
    schema:
      type: boolean
  - in: query
    name: search[source_changed]
    schema:
      type: boolean
  - in: query
    name: search[uploads]
    schema:
      type: string
      enum:
        - included
        - excluded
        - only
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../components/schemas/models/PostVersion.yml"
