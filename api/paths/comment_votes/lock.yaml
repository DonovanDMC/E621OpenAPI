summary: Lock Comment Votes
operationId: lockCommentVotes
tags:
  - Comment Votes
security:
  - basicAuth: []
description: |
  You must be Moderator+. Errors if ids is not provided.
parameters:
  - name: ids
    in: query
    required: true
    description: The IDs of the comment votes, comma separated.
    schema:
      type: string
responses:
  204:
    description: Success
  403:
    $ref: "../../components/responseBodies/accessDenied.yaml"
  404:
    $ref: "../../components/responseBodies/notFound.yaml"
  422:
    $ref: "../../components/responseBodies/expectedError.yaml"
