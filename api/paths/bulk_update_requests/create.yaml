summary: Create Bulk Update Request
operationId: bulk_update_requests#create
tags:
- Bulk Update Requests
security:
- basicAuth: []
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - bulk_update_request[script]
        - bulk_update_request[title]
        - bulk_update_request[reason]
        properties:
          bulk_update_request[script]:
            type: string
          bulk_update_request[title]:
            type: string
          bulk_update_request[reason]:
            type: string
          bulk_update_request[forum_topic_id]:
            type: integer
            description: You must be able to reply to the topic.
          bulk_update_request[skip_forum]:
            type: boolean
            description: Only usable for Admin+
responses:
  201:
    description: Success
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/models/BulkUpdateRequest.yml"
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
