summary: Bulk Update Requests Index
operationId: bulk_update_requests#index
tags:
  - Bulk Update Requests
parameters:
  - $ref: "../../components/parameters/query/limit.yaml"
  - $ref: "../../components/parameters/query/page.yaml"
  - $ref: "../../components/parameters/query/id.yaml"
  - name: search[order]
    in: query
    schema:
      type: string
      enum:
        - id_asc
        - id_desc
        - status_desc
        - updated_at_desc
        - updated_at_asc
  - name: search[user_id]
    in: query
    schema:
      type: integer
  - name: search[user_name]
    in: query
    schema:
      type: string
  - name: search[approver_id]
    in: query
    schema:
      type: integer
  - name: search[approver_name]
    in: query
    schema:
      type: string
  - name: search[forum_topic_id]
    in: query
    schema:
      type: integer
  - name: search[forum_post_id]
    in: query
    schema:
      type: integer
  - name: search[status]
    in: query
    schema:
      type: string
      description: Multiple can be specified via comma separating.
      enum:
        - approved
        - rejected
        - pending
  - name: search[title_matches]
    in: query
    schema:
      type: string
  - name: search[script_matches]
    in: query
    schema:
      type: string
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../components/schemas/bulkUpdateRequest.yaml"
