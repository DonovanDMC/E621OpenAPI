summary: Create Saved Search
operationId: saved_searches#create
tags:
  - Saved Searches
security:
  - basicAuth: []
description: |
  Users can have up to 250 saved searches, and track up to 50 of them.
  Saved search queries cannot contain wildcard tags or `search:` metatags.
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
          - saved_search[query]
        properties:
          saved_search[query]:
            description: See [Search Syntax](https://e621.wiki/searching/).
            type: string
            maxLength: 500
          saved_search[name]:
            type: string
            minLength: 3
            maxLength: 100
            pattern: ^\d*[a-z_]\w*$
            description: Used to reference the search with `search:<name>`. Cannot be `subscriptions`.
          saved_search[is_tracked]:
            type: boolean
            description: Track new posts matching the search.
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/models/SavedSearch.yml"
  403:
    $ref: "../../components/responses/accessDenied.yaml"
  422:
    $ref: "../../components/responses/messageError.yaml"
