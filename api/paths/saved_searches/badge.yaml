summary: Get Saved Search Badge
operationId: saved_searches#badge
tags:
  - Saved Searches
security:
  - basicAuth: []
description: Total new post count across the current user's tracked saved searches. Read from cache only.
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: object
          required:
            - count
            - fresh
          properties:
            count:
              type: integer
              nullable: true
              description: Null when nothing is cached.
            fresh:
              type: boolean
              description: False when the cached count is stale or missing.
  403:
    $ref: "../../components/responses/accessDenied.yaml"
