summary: Unflag Post
operationId: post_flags#destroy
tags:
- Posts
description: You must have the "Approve Posts" permission.
security:
- basicAuth: []
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          approval:
            type: string
            description: Approves the post if set to "approve".
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/models/RawPost.yml"
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
