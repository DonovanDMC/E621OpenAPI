summary: Create Forum Post Vote
operationId: forum_post_votes#create
tags:
- Forum Post Votes
security:
- basicAuth: []
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - forum_post_vote[score]
        properties:
          forum_post_vote[score]:
            "$ref": "../../components/schemas/enums/UpDownMehFlipVote.yml"
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/models/ForumPostVote.yml"
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
