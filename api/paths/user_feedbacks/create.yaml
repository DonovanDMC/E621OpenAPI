summary: Create User Feedback
operationId: user_feedbacks#create
tags:
- User Feedbacks
security:
- basicAuth: []
description: You must be Moderator+.
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - user_feedback[body]
        - user_feedback[category]
        properties:
          user_feedback[user_id]:
            type: integer
          user_feedback[user_name]:
            type: string
          user_feedback[body]:
            type: string
          user_feedback[category]:
            "$ref": "../../components/schemas/enums/UserFeedbackCategory.yml"
responses:
  201:
    description: Success
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/models/UserFeedback.yml"
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
