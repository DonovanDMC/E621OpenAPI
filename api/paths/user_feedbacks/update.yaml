summary: Update User Feedback
operationId: user_feedbacks#update
tags:
- User Feedbacks
security:
- basicAuth: []
description: You must be Moderator+.
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          user_feedback[body]:
            type: string
          user_feedback[category]:
            "$ref": "../../components/schemas/enums/UserFeedbackCategory.yml"
responses:
  204:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
