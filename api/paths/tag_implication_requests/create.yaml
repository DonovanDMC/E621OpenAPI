summary: Create Tag Implication
operationId: tag_implication_requests#create
tags:
- Tag Implications
security:
- basicAuth: []
description: Errors will result in a 406 with no information.
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - tag_implication_request[antecedent_name]
        - tag_implication_request[consequent_name]
        - tag_implication_request[reason]
        properties:
          tag_implication_request[antecedent_name]:
            type: string
          tag_implication_request[consequent_name]:
            type: string
          tag_implication_request[reason]:
            type: string
          tag_implication_request[skip_forum]:
            type: boolean
            description: Must be Admin+.
responses:
  302:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  406:
    description: Failure
