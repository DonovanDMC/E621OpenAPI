summary: Create Favorite
operationId: favorites#create
tags:
- Favorites
description: Creates and deletes share a limit of 60 per minute. They don't count towards the general write limit.
security:
- basicAuth: []
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - post_id
        properties:
          post_id:
            type: integer
responses:
  201:
    description: Success
    content:
      application/json:
        schema:
          type: object
          required:
          - post_id
          - favorite_count
          properties:
            post_id:
              type: integer
            favorite_count:
              type: integer
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
  429:
    description: Ratelimited
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/responses/MessageErrorResponse.yml"
