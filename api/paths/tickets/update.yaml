summary: Update Ticket
operationId: tickets#update
tags:
- Tickets
description: You must be Moderator+.
security:
- basicAuth: []
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - ticket[response]
        properties:
          ticket[status]:
            type: string
            enum:
            - partial
            - approved
          ticket[response]:
            type: string
          ticket[record_type]:
            "$ref": "../../components/schemas/enums/WarningType.yml"
          ticket[send_update_dmail]:
            type: boolean
            description: An update dmail will always be sent when the status is changed.
responses:
  204:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
