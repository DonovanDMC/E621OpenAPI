summary: Upload Post
operationId: uploads#create
tags:
  - Uploads
  - Posts
security:
  - basicAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - upload[tag_string]
          - upload[rating]
        properties:
          upload[file]:
            type: string
            format: binary
            description: Mutually exclusive with direct_url.
          upload[direct_url]:
            type: string
            description: Mutually exclusive with file.
          upload[source]:
            type: string
          upload[tag_string]:
            type: string
          upload[rating]:
            $ref: "../../components/schemas/enums/Rating.yml"
          upload[parent_id]:
            type: integer
          upload[description]:
            type: string
          upload[as_pending]:
            type: boolean
            description: Must have the "Unrestricted Uploads" permission.
          upload[locked_rating]:
            type: boolean
            description: Must be Privileged+ to use.
          upload[locked_tags]:
            type: string
            description: Must be Admin+ to use.
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: object
          required:
            - success
            - location
            - upload_id
          properties:
            success:
              type: boolean
              enum:
                - true
            location:
              type: string
              description: The post, or the upload if it is still being processed.
            post_id:
              type: integer
              description: Not present if the upload is still being processed.
            upload_id:
              type: integer
  403:
    $ref: "../../components/responses/accessDenied.yaml"
  412:
    description: The upload was invalid, failed, or is a duplicate
    content:
      application/json:
        schema:
          oneOf:
            - type: object
              required:
                - success
                - reason
                - message
              properties:
                success:
                  type: boolean
                  enum:
                    - false
                reason:
                  type: string
                  enum:
                    - invalid
                message:
                  type: string
            - type: object
              required:
                - success
                - reason
                - location
                - post_id
              properties:
                success:
                  type: boolean
                  enum:
                    - false
                reason:
                  type: string
                  enum:
                    - duplicate
                location:
                  type: string
                  description: The duplicate post.
                post_id:
                  type: integer
                  description: The duplicate post's id.
