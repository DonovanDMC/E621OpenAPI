summary: Uploads Index
operationId: uploads#index
tags:
  - Uploads
parameters:
  - $ref: "../../components/parameters/query/limit.yaml"
  - $ref: "../../components/parameters/query/page.yaml"
  - $ref: "../../components/parameters/query/id.yaml"
  - $ref: "../../components/parameters/query/order.yaml"
  - in: query
    name: search[uploader_id]
    schema:
      type: integer
  - in: query
    name: search[uploader_name]
    schema:
      type: string
  - in: query
    name: search[source]
    schema:
      type: string
  - in: query
    name: search[source_matches]
    schema:
      type: string
  - in: query
    name: search[rating]
    schema:
      $ref: "../../components/schemas/ratings.yaml"
  - in: query
    name: search[parent_id]
    schema:
      type: integer
  - in: query
    name: search[post_id]
    schema:
      type: integer
  - in: query
    name: search[has_post]
    schema:
      type: boolean
  - in: query
    name: search[post_tags_match]
    schema:
      type: string
  - in: query
    name: search[status]
    schema:
      type: string
      description: |
        Note: The "error" status will be proceeded by an error, ex: "error: RuntimeError - No file or source URL provided"
      enum:
        - completed
        - processing
        - pending
        - error
  - in: query
    name: search[backtrace]
    schema:
      type: string
  - in: query
    name: search[tag_string]
    schema:
      type: string
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../components/schemas/upload.yaml"
