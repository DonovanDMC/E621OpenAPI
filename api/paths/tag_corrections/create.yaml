summary: Correct Tag
operationId: tag_corrections#create
tags:
- Tags
security:
- basicAuth: []
description: You must be Staff+. `commit=Fix` must be set.
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - commit
        properties:
          commit:
            type: string
            enum:
            - Fix
            description: If not set, nothing will happen.
responses:
  302:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
