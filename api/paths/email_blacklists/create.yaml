summary: Create Email Blacklist
operationId: email_blacklists#create
tags:
- Email Blacklists
description: You must be Admin+.
security:
- basicAuth: []
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - email_blacklist[domain]
        - email_blacklist[reason]
        properties:
          email_blacklist[domain]:
            type: string
          email_blacklist[reason]:
            type: string
responses:
  201:
    description: Success
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/models/EmailBlacklist.yml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
