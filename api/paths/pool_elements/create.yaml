summary: Add Post To Pool
operationId: pool_elements#create
tags:
- Pools
security:
- basicAuth: []
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - post_id
        properties:
          pool_id:
            type: integer
            description: Mutually exclusive with pool_name.
          pool_name:
            type: string
            description: Mutually exclusive with pool_id.
          post_id:
            type: integer
responses:
  201:
    description: Success
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/models/Pool.yml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
