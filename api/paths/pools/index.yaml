summary: Pools Index
operationId: pools#index
tags:
  - Pools
parameters:
  - $ref: "../../components/parameters/query/limit.yaml"
  - $ref: "../../components/parameters/query/page.yaml"
  - $ref: "../../components/parameters/query/id.yaml"
  - name: search[order]
    in: query
    schema:
      type: string
      enum:
        - id_asc
        - id_desc
        - name
        - created_at
        - post_count
  - in: query
    name: search[name_matches]
    schema:
      type: string
  - in: query
    name: search[description_matches]
    schema:
      type: string
  - in: query
    name: search[creator_id]
    schema:
      type: integer
  - in: query
    name: search[creator_name]
    schema:
      type: string
  - in: query
    name: search[category]
    schema:
      $ref: "../../components/schemas/enums/PoolCategory.yml"
  - in: query
    name: search[is_active]
    schema:
      type: boolean
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../components/schemas/models/Pool.yml"
