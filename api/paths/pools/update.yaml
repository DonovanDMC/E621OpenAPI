summary: Update Pool
operationId: pools#update
tags:
- Pools
security:
- basicAuth: []
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          pool[name]:
            type: string
          pool[description]:
            type: string
          pool[is_active]:
            type: boolean
          pool[category]:
            "$ref": "../../components/schemas/enums/PoolCategory.yml"
          pool[post_ids_string]:
            type: string
            description: Space separated list of post IDs. Mutually exclusive with
              post_ids.
          pool[post_ids][]:
            type: array
            description: Array of post IDs. Mutually exclusive with post_ids_string.
            items:
              type: integer
responses:
  204:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
