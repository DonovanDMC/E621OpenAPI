summary: Login
operationId: sessions#create
tags:
  - Sessions
security:
  - csrfToken: []
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
          - authenticity_token
          - session[name]
          - session[password]
        properties:
          authenticity_token:
            type: string
            description: CSRF Token
          session[url]:
            type: string
            description: Optional local path (starting with `/`) to redirect to after login. Anything else is ignored, and `/posts` is used.
          session[name]:
            type: string
          session[password]:
            type: string
          session[remember]:
            type: boolean
            description: Stay logged in after the browser is closed.
responses:
  200:
    description: Success
    headers:
      Set-Cookie:
        description: The session cookie.
        schema:
          type: string
          example: _danbooru_session=(...); path=/; secure; httponly; samesite=lax
    content:
      application/json:
        schema:
          type: object
          required:
            - url
          properties:
            url:
              type: string
              description: Where to go next, `session[url]` or `/posts`.
  401:
    description: The username or password was incorrect, or two-factor authentication is required (verification required within 5 minutes)
    content:
      application/json:
        schema:
          type: object
          required:
            - error
          properties:
            error:
              type: string
            code:
              type: string
              description: Only present when two-factor authentication is required.
              enum:
                - totp_required
            url:
              type: string
              description: The two-factor authentication page. Only present when two-factor authentication is required.
  403:
    $ref: "../../components/responses/accessDenied.yaml"
  406:
    description: Failure
  429:
    description: |
      Ratelimited, either too many failed logins from your IP, or for this account.<br>
      If it's for the account and captchas are enabled, `code` is `captcha_required` and the login has to be completed through `url` on the website.
    content:
      application/json:
        schema:
          type: object
          required:
            - error
          properties:
            error:
              type: string
            code:
              type: string
              enum:
                - captcha_required
            url:
              type: string
              description: The login page with the captcha. Only present with `captcha_required`.
