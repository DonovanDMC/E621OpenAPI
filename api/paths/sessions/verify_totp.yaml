summary: Verify TOTP
operationId: sessions#verify_totp
tags:
  - Sessions
security:
  - csrfToken: []
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
          - authenticity_token
          - totp[code]
        properties:
          authenticity_token:
            type: string
            description: CSRF Token
          totp[code]:
            type: string
            description: Code or backup code
responses:
  200:
    description: Success
    headers:
      Set-Cookie:
        description: The session cookie.
        schema:
          type: string
          example: _danbooru_session=(...); path=/; secure; httponly; samesite=lax
    content:
      application/json:
        schema:
          type: object
          required:
            - url
          properties:
            url:
              type: string
  401:
    description: Challenge expired or code incorrect
    content:
      application/json:
        schema:
          type: object
          required:
            - error
          properties:
            error:
              type: string
            code:
              type: string
              enum:
                - challenge_expired
  403:
    $ref: "../../components/responses/accessDenied.yaml"
  429:
    description: Ratelimited
    content:
      application/json:
        schema:
          type: object
          required:
            - error
          properties:
            error:
              type: string
