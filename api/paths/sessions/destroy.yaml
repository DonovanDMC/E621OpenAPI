summary: Logout
operationId: sessions#destroy
tags:
  - Sessions
security:
  - csrfToken: []
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
          - authenticity_token
        properties:
          authenticity_token:
            type: string
            description: CSRF Token
responses:
  302:
    description: Success
  403:
    $ref: "../../components/responses/accessDenied.yaml"
  406:
    description: Failure
