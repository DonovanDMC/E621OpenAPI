summary: Create Artist
operationId: artists#create
tags:
- Artists
security:
- basicAuth: []
description: |
  `other_names` & `urls` are silently truncated to 25 entries.
  `notes` is silently truncated to the wiki page limit (250,000).
  Individual `other_names` are silently truncated to 100 characters.
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - artist[name]
        properties:
          artist[name]:
            type: string
          artist[other_names][]:
            type: array
            items:
              type: string
          artist[other_names_string]:
            type: string
          artist[url_string]:
            type: string
          artist[notes]:
            type: string
          artist[group_name]:
            type: string
          artist[linked_user_id]:
            type: integer
            nullable: true
            description: Only usable for Staff+
          artist[is_locked]:
            type: boolean
            description: Only usable for Staff+
responses:
  201:
    description: Success
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/models/Artist.yml"
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
