summary: Artists Index
operationId: artists#index
tags:
  - Artists
parameters:
  - $ref: "../../components/parameters/query/limit.yaml"
  - $ref: "../../components/parameters/query/page.yaml"
  - $ref: "../../components/parameters/query/id.yaml"
  - name: search[order]
    in: query
    schema:
      type: string
      enum:
        - id_asc
        - id_desc
        - updated_at
        - name
        - post_count
  - name: search[name]
    in: query
    schema:
      type: string
  - name: search[group_name]
    in: query
    schema:
      type: string
  - name: search[any_other_name_like]
    in: query
    schema:
      type: string
  - name: search[any_name_matches]
    in: query
    schema:
      type: string
  - name: search[any_name_or_url_matches]
    in: query
    schema:
      type: string
  - name: search[url_matches]
    in: query
    schema:
      type: string
  - name: search[creator_name]
    in: query
    schema:
      type: string
  - name: search[creator_id]
    in: query
    schema:
      type: integer
  - name: search[has_tag]
    in: query
    schema:
      type: boolean
  - name: search[is_linked]
    in: query
    schema:
      type: string
  - name: search[linked_user_id]
    in: query
    schema:
      type: integer
  - name: search[linked_user_name]
    in: query
    schema:
      type: string
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            allOf:
              - $ref: "../../components/schemas/artist.yaml"
              - type: object
                required:
                  - urls
                properties:
                  urls:
                    type: array
                    items:
                      $ref: "../../components/schemas/artistUrl.yaml"
