summary: Get Artist
operationId: artists#show
tags:
  - Artists
parameters:
  - $ref: "../../components/parameters/path/idOrName.yaml"
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          allOf:
            - $ref: "../../components/schemas/models/Artist.yml"
            - type: object
              required:
                - domains
                - urls
              properties:
                domains:
                  type: array
                  items:
                    type: array
                    example: [["e621.net", 1]]
                    items:
                      oneOf:
                        - type: string
                        - type: integer
                urls:
                  type: array
                  items:
                    $ref: "../../components/schemas/models/ArtistURL.yml"
  404:
    $ref: "../../components/responses/notFound.yaml"
