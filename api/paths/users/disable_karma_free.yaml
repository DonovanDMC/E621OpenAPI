summary: User Disable Karma Free
operationId: users#disable_karma_free
tags:
  - Users
description: You must be Janitor+.
security:
  - basicAuth: []
parameters:
  - $ref: "../../components/parameters/path/idOrName.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
          - staff_note[body]
        properties:
          staff_note[body]:
            type: string
responses:
  302:
    description: |
      Redirect
      Success should be determined based on the html, any errors will be present in an alert.
  403:
    $ref: "../../components/responses/accessDenied.yaml"
  404:
    $ref: "../../components/responses/notFound.yaml"
