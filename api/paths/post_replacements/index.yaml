summary: Post Replacements Index
operationId: post_replacements#index
tags:
  - Post Replacements
description: Rejected replacements can only be seen by staff.
parameters:
  - $ref: "../../components/parameters/query/limit.yaml"
  - $ref: "../../components/parameters/query/page.yaml"
  - $ref: "../../components/parameters/query/id.yaml"
  - in: query
    name: search[file_ext]
    schema:
      type: string
  - in: query
    name: search[md5]
    schema:
      type: string
  - in: query
    name: search[status]
    schema:
      type: string
  - in: query
    name: search[creator_id]
    schema:
      type: integer
  - in: query
    name: search[creator_name]
    schema:
      type: string
  - in: query
    name: search[approver_id]
    schema:
      type: integer
  - in: query
    name: search[approver_name]
    schema:
      type: string
  - in: query
    name: search[uploader_name_on_approve]
    schema:
      type: string
  - in: query
    name: search[uploader_id_on_approve]
    schema:
      type: integer
  - in: query
    name: search[post_id]
    description: |
      Allows a comma separated list of up to 100 post IDs.
    schema:
      type: string
  - in: query
    name: search[reason]
    schema:
      type: string
  - in: query
    name: search[penalized]
    schema:
      type: boolean
  - in: query
    name: search[source]
    schema:
      type: string
  - in: query
    name: search[file_name]
    schema:
      type: string
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../components/schemas/postReplacement.yaml"
