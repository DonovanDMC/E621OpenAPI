summary: Update Appeal
operationId: appeals#update
tags:
- Appeals
description: You must be Janitor+.
security:
- basicAuth: []
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          appeal[status]:
            type: string
            enum:
            - partial
            - approved
          appeal[response]:
            type: string
          appeal[send_update_dmail]:
            type: boolean
            description: An update dmail will always be sent when the status is changed.
responses:
  204:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
