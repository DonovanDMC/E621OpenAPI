summary: Comments Index
operationId: comments#index
tags:
  - Comments
description: For searching comments, group_by=comment must be set.
parameters:
  - $ref: "../../components/parameters/query/limit.yaml"
  - $ref: "../../components/parameters/query/page.yaml"
  - $ref: "../../components/parameters/query/id.yaml"
  - $ref: "../../components/parameters/query/ipAddr.yaml"
  - name: search[order]
    in: query
    schema:
      type: string
      enum:
        - id_asc
        - id_desc
        - status
        - status_desc
        - updated_at_desc
  - in: query
    name: group_by
    schema:
      type: string
      enum:
        - comment
        - post
  - in: query
    name: search[body_matches]
    schema:
      type: string
  - in: query
    name: search[post_id]
    description: Accepts a comma separated list.
    schema:
      type: string
  - in: query
    name: search[post_tags_match]
    schema:
      type: string
  - in: query
    name: search[post_note_updater_name]
    schema:
      type: string
  - in: query
    name: search[post_note_updater_id]
    schema:
      type: integer
  - in: query
    name: search[creator_name]
    schema:
      type: string
  - in: query
    name: search[creator_id]
    schema:
      type: integer
  - in: query
    name: search[is_sticky]
    schema:
      type: boolean
  - in: query
    name: search[is_hidden]
    description: Only usable by Staff+
    schema:
      type: boolean
  - in: query
    name: search[do_not_bump_post]
    schema:
      type: boolean
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../components/schemas/comment.yaml"
