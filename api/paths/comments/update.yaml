summary: Update Comment
operationId: comments#update
tags:
- Comments
security:
- basicAuth: []
description: 'You must be the creator of the comment, or Admin+ to edit. Marked comments
  cannot be edited.

  '
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          comment[body]:
            type: string
          comment[is_sticky]:
            type: boolean
            description: Only usable for Staff+
          comment[is_hidden]:
            type: boolean
            description: Only usable for Moderator+
responses:
  204:
    description: Success
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
