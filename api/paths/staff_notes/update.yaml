summary: Update Staff Note
operationId: staff_notes#update
tags:
- Staff Notes
security:
- basicAuth: []
description: You must be the creator or Admin+.
parameters:
- "$ref": "../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          staff_note[body]:
            type: string
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          "$ref": "../../components/schemas/models/StaffNote.yml"
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../components/responses/notFound.yaml"
  422:
    "$ref": "../../components/responses/expectedError.yaml"
