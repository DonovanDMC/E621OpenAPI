summary: Delete Post
operationId: staff/post/posts#delete
tags:
- Posts
security:
- basicAuth: []
description: You must have the "Approve Posts" permission. `commit=Delete` must be
  set.
parameters:
- "$ref": "../../../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          reason:
            type: string
            description: If the post does not have an active flag, this is required.
          move_favorites:
            type: boolean
            description: Move favorites to parent.
          copy_sources:
            type: boolean
            description: Copy sources to parent.
          copy_tags:
            type: boolean
            description: Copy tags to parent.
          dmail:
            type: string
            description: |
              The content of the dmail to send to the uploader.
              Placeholders:
              - %REASON%
              - %POST_ID%
              - %STAFF_NAME%
              - %STAFF_ID%
              - %UPLOADER_ID%
              - %FLAG_ID%
          dmail_title:
            type: string
            description: |
              The title of the dmail to send to the uploader.
                Placeholders:
                - %REASON%
                - %POST_ID%
                - %STAFF_NAME%
                - %STAFF_ID%
                - %UPLOADER_ID%
                - %FLAG_ID%
          commit:
            type: string
            description: If not set, nothing will happen.
            enum:
            - Delete
responses:
  201:
    description: Success
    content:
      application/json:
        schema:
          "$ref": "../../../../components/schemas/models/RawPost.yml"
  302:
    description: No reason was given, redirects to the confirmation page
  409:
    description: The post is already deleted
    content:
      application/json:
        schema:
          type: object
          required:
          - reason
          properties:
            reason:
              type: string
              example: "Post #123 is already deleted"
  403:
    "$ref": "../../../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../../../components/responses/notFound.yaml"
  422:
    "$ref": "../../../../components/responses/expectedError.yaml"
