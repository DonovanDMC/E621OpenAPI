summary: Expunge Post
operationId: staff/post/posts#expunge
tags:
- Posts
security:
- basicAuth: []
description: You must have the "Approve Posts" permission and be Admin+.
parameters:
- "$ref": "../../../../components/parameters/path/id.yaml"
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          reason:
            type: string
responses:
  201:
    description: Success
    content:
      application/json:
        schema:
          "$ref": "../../../../components/schemas/models/RawPost.yml"
  403:
    "$ref": "../../../../components/responses/accessDenied.yaml"
  404:
    "$ref": "../../../../components/responses/notFound.yaml"
  422:
    "$ref": "../../../../components/responses/expectedError.yaml"
