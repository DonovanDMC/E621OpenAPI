summary: Get Post Previous Owners
operationId: staff/post/posts#previous_owners
tags:
  - Posts
security:
  - basicAuth: []
description: You must be an Approver
parameters:
  - $ref: "../../../../components/parameters/path/id.yaml"
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: integer
              name:
                type: string
  403:
    $ref: "../../../../components/responses/accessDenied.yaml"
  404:
    $ref: "../../../../components/responses/notFound.yaml"
