summary: Reset User TOTP
operationId: staff/users#totp_reset
tags:
  - Staff Users
security:
  - browserAuth: []
    csrfToken: []
description: |
  You must be Admin+. You must have the bd staff flag if the user is Staff+.<br>
  Requires [browser authentication](#operations-Sessions-login) (username & password), as well as hourly password confirmations (reauthentication).
parameters:
  - $ref: "../../../components/parameters/path/id.yaml"
responses:
  302:
    description: |
      Redirect
      Success should be determined based on the html, any errors will be present in an alert.
  404:
    $ref: "../../../components/responses/notFound.yaml"
