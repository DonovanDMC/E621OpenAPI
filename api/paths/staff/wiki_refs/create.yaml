summary: Create Staff Wiki Ref
operationId: staff/wiki_refs#create
tags:
  - Staff Wiki Refs
security:
  - basicAuth: []
parameters:
  - $ref: "../../../components/parameters/path/id.yaml"
description: You must be Staff+.
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
          - staff_wiki_ref[related_type]
          - staff_wiki_ref[related_id]
        properties:
          staff_wiki_ref[related_type]:
            $ref: "../../../components/schemas/staffWikiRefRelatedType.yaml"
          staff_wiki_ref[related_id]:
            type: integer
responses:
  302:
    description: |
      Redirect
      Success should be determined based on the html, any errors will be present in an alert.
  403:
    $ref: "../../../components/responses/accessDenied.yaml"
  404:
    $ref: "../../../components/responses/notFound.yaml"
