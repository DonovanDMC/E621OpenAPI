summary: Search Staff Wikis
operationId: searchStaffWikis
tags:
  - Staff Wikis
security:
  - basicAuth: []
description: You must be Staff+.
parameters:
  - $ref: "../../../components/parameters/query/limit.yaml"
  - $ref: "../../../components/parameters/query/page.yaml"
  - $ref: "../../../components/parameters/query/id.yaml"
  - name: search[order]
    in: query
    schema:
      type: string
      enum:
        - id_asc
        - id_desc
        - title
  - name: search[creator_id]
    in: query
    schema:
      type: integer
  - name: search[creator_name]
    in: query
    schema:
      type: string
  - name: search[title]
    in: query
    schema:
      type: string
  - name: search[body_matches]
    in: query
    schema:
      type: string
  - name: search[editor_id]
    in: query
    schema:
      type: integer
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../../components/schemas/staffWiki.yaml"
  403:
    $ref: "../../../components/responses/accessDenied.yaml"
