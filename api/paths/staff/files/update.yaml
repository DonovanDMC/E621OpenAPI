summary: Update Staff File
operationId: staff/files#update
tags:
  - Staff Files
security:
  - basicAuth: []
description: You must be Admin+ if you did not create the file, else Staff+
parameters:
  - $ref: "../../../components/parameters/path/id.yaml"
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          staff_file[title]:
            type: string
          staff_file[description]:
            type: string
responses:
  204:
    description: Success
  403:
    $ref: "../../../components/responses/accessDenied.yaml"
  404:
    $ref: "../../../components/responses/notFound.yaml"
  422:
    $ref: "../../../components/responses/expectedError.yaml"
