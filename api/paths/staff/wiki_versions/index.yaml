summary: Staff Wiki Versions Index
operationId: staff/wiki_versions#index
tags:
  - Staff Wiki Versions
security:
  - basicAuth: []
description: You must be Staff+.
parameters:
  - $ref: "../../../components/parameters/query/limit.yaml"
  - $ref: "../../../components/parameters/query/page.yaml"
  - $ref: "../../../components/parameters/query/id.yaml"
  - name: search[order]
    in: query
    schema:
      type: string
      enum:
        - id_asc
        - id_desc
        - title
  - name: search[updater_id]
    in: query
    schema:
      type: integer
  - name: search[updater_name]
    in: query
    schema:
      type: string
  - name: search[staff_wiki_id]
    in: query
    schema:
      type: integer
  - name: search[title]
    in: query
    schema:
      type: string
  - name: search[body]
    in: query
    schema:
      type: string
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: "../../../components/schemas/models/StaffWikiVersion.yml"
  403:
    $ref: "../../../components/responses/accessDenied.yaml"
