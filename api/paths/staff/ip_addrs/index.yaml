summary: Staff IP Addrs Index
operationId: staff/ip_addrs#index
tags:
  - Staff IP Addrs
security:
  - basicAuth: []
description: You must be Admin+.
parameters:
  - name: search[with_history]
    in: query
    schema:
      type: boolean
  - name: search[user_id]
    in: query
    description: Accepts multiple comma separated values.
    schema:
      type: string
  - name: search[user_name]
    in: query
    description: Accepts multiple comma separated values.
    schema:
      type: string
  - name: search[ip_addr]
    in: query
    description: Accepts multiple comma separated values.
    schema:
      type: string
  - name: search[add_ip_mask]
    in: query
    schema:
      type: boolean
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            oneOf:
              - $ref: "../../../components/schemas/staffIpAddr/userListing.yaml"
                description: If `search[user_id]` or `search[user_name]` is used.
              - $ref: "../../../components/schemas/staffIpAddr/ipListing.yaml"
                description: If `search[ip_addr]` is used.
  403:
    $ref: "../../../components/responses/accessDenied.yaml"
  422:
    $ref: "../../../components/responses/expectedError.yaml"
