summary: Update Staff Wiki
operationId: staff/wikis#update
tags:
  - Staff Wikis
security:
  - basicAuth: []
description: You must be Staff+
parameters:
  - $ref: "../../../components/parameters/path/id.yaml"
requestBody:
  content:
    multipart/x-www-form-urlencoded:
      schema:
        type: object
        properties:
          staff_wiki[title]:
            type: string
          staff_wiki[body]:
            type: string
          # allowed by code but errors
          #staff_wiki[edit_reason]:
          #  type: string
responses:
  204:
    description: Success
  403:
    $ref: "../../../components/responses/accessDenied.yaml"
  404:
    $ref: "../../../components/responses/notFound.yaml"
  422:
    $ref: "../../../components/responses/expectedError.yaml"
