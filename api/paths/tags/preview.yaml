summary: Preview Tags
operationId: tags#preview
tags:
- Tags
security:
- basicAuth: []
requestBody:
  content:
    application/x-www-form-urlencoded:
      schema:
        type: object
        required:
        - tags
        properties:
          tags:
            type: string
            description: The tags to preview, space separated.
responses:
  200:
    description: Success
    content:
      application/json:
        schema:
          type: array
          items:
            "$ref": "../../components/schemas/models/TagPreview.yml"
  403:
    "$ref": "../../components/responses/accessDenied.yaml"
