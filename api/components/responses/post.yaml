description: |
  Success
  Open the schema and find the schema for the mode being used.
content:
  application/json:
    schema:
      oneOf:
        - allOf:
            - $ref: "../schemas/models/BasicPost.yml"
            - description: The basic format, returned by default, or with `mode=basic`.
        - allOf:
            - $ref: "../schemas/models/ExtendedPost.yml"
            - description: The extended format, returned with `mode=extended`.
        - allOf:
            - $ref: "../schemas/models/ThumbnailPost.yml"
            - description: The thumbnail format, returned with `mode=thumbnail`.
        - type: object
          description: The legacy format, returned with `v1=true`. This format is deprecated.
          required:
            - post
          properties:
            post:
              $ref: "../schemas/models/LegacyPost.yml"
