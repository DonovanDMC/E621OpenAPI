type: object
required:
  - issuer
  - authorization_endpoint
  - token_endpoint
  - revocation_endpoint
  - introspection_endpoint
  - userinfo_endpoint
  - jwks_uri
  - scopes_supported
  - response_types_supported
  - response_modes_supported
  - grant_types_supported
  - token_endpoint_auth_methods_supported
  - subject_types_supported
  - id_token_signing_alg_values_supported
  - claim_types_supported
  - claims_supported
  - code_challenge_methods_supported
properties:
  issuer:
    type: string
    format: uri
  authorization_endpoint:
    type: string
    format: uri
  token_endpoint:
    type: string
    format: uri
  revocation_endpoint:
    type: string
    format: uri
  introspection_endpoint:
    type: string
    format: uri
  userinfo_endpoint:
    type: string
    format: uri
  jwks_uri:
    type: string
    format: uri
  scopes_supported:
    type: array
    items:
      $ref: "./openIdConfiguration/scopes.yaml"
  response_types_supported:
    type: array
    items:
      $ref: "./openIdConfiguration/responseTypes.yaml"
  response_modes_supported:
    type: array
    items:
      $ref: "./openIdConfiguration/response_modes.yaml"
  grant_types_supported:
    type: array
    items:
      $ref: "./openIdConfiguration/grantTypes.yaml"
  token_endpoint_auth_methods_supported:
    type: array
    items:
      $ref: "./openIdConfiguration/tokenEndpointAuthMethods.yaml"
  subject_types_supported:
    type: array
    items:
      $ref: "./openIdConfiguration/subjectTypes.yaml"
  id_token_signing_alg_values_supported:
    type: array
    items:
      $ref: "./openIdConfiguration/idTokenSigningAlgValues.yaml"
  claim_types_supported:
    type: array
    items:
      $ref: "./openIdConfiguration/claimTypes.yaml"
  claims_supported:
    type: array
    items:
      $ref: "./openIdConfiguration/claims.yaml"
  code_challenge_methods_supported:
    type: array
    items:
      $ref: "./openIdConfiguration/codeChallengeMethods.yaml"
