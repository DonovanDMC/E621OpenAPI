type: object
required:
  - id
  - user_id
  - creator_id
  - post_id
  - reason
  - delta
  - balance
  - extra_data
  - created_at
properties:
  id:
    type: integer
  user_id:
    type: integer
  creator_id:
    type: integer
  post_id:
    type: integer
    nullable: true
  reason:
    $ref: "../enums/UploadKarmaEventReason.yml"
  delta:
    type: integer
  balance:
    type: integer
  extra_data:
    type: object
    additionalProperties: true
  created_at:
    type: string
    format: date-time
