type: object
required:
  - access_token
  - token_type
  - expires_in
  - refresh_token
  - scope
  - created_at
properties:
  access_token:
    type: string
  token_type:
    type: string
    enum:
      - Bearer
  expires_in:
    type: integer
    description: Seconds until `access_token` expires.
  refresh_token:
    type: string
  scope:
    type: string
    description: Space-separated list of granted scopes.
  created_at:
    type: integer
    description: Unix timestamp of when the token was issued.
  id_token:
    type: string
    description: A signed JWT containing the user's ID token claims. Present only when the `openid` scope was granted.
