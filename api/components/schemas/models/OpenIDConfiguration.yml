type: object
required:
  - issuer
  - authorization_endpoint
  - token_endpoint
  - revocation_endpoint
  - introspection_endpoint
  - userinfo_endpoint
  - jwks_uri
  - scopes_supported
  - response_types_supported
  - response_modes_supported
  - grant_types_supported
  - token_endpoint_auth_methods_supported
  - subject_types_supported
  - id_token_signing_alg_values_supported
  - claim_types_supported
  - claims_supported
  - code_challenge_methods_supported
properties:
  issuer:
    type: string
    format: uri
  authorization_endpoint:
    type: string
    format: uri
  token_endpoint:
    type: string
    format: uri
  revocation_endpoint:
    type: string
    format: uri
  introspection_endpoint:
    type: string
    format: uri
  userinfo_endpoint:
    type: string
    format: uri
  jwks_uri:
    type: string
    format: uri
  scopes_supported:
    type: array
    items:
      $ref: "../enums/OAuthScope.yml"
  response_types_supported:
    type: array
    items:
      $ref: "../enums/OAuthResponseType.yml"
  response_modes_supported:
    type: array
    items:
      $ref: "../enums/OAuthResponseMode.yml"
  grant_types_supported:
    type: array
    items:
      $ref: "../enums/OAuthGrantType.yml"
  token_endpoint_auth_methods_supported:
    type: array
    items:
      $ref: "../enums/OAuthTokenEndpointAuthMethod.yml"
  subject_types_supported:
    type: array
    items:
      $ref: "../enums/OAuthSubjectType.yml"
  id_token_signing_alg_values_supported:
    type: array
    items:
      $ref: "../enums/OAuthIDTokenSigningAlgValue.yml"
  claim_types_supported:
    type: array
    items:
      $ref: "../enums/OAuthClaimType.yml"
  claims_supported:
    type: array
    items:
      $ref: "../enums/OAuthClaim.yml"
  code_challenge_methods_supported:
    type: array
    items:
      $ref: "../enums/OAuthCodeChallengeMethod.yml"
