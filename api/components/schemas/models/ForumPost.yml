type: object
required:
  - id
  - topic_id
  - creator_id
  - updater_id
  - body
  - is_hidden
  - created_at
  - updated_at
  - warning_type
  - warning_user_id
  - vote_score
  - creator_name
  - updater_name
properties:
  id:
    type: integer
  topic_id:
    type: integer
  creator_id:
    type: integer
  updater_id:
    type: integer
  body:
    type: string
  is_hidden:
    type: boolean
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  warning_type:
    $ref: "../enums/WarningType.yml"
  warning_user_id:
    type: integer
    nullable: true
  vote_score:
    type: string
    nullable: true
    description: Net votes divided by total votes, from -1 to 1. Null if the post has never been voted on.
  creator_name:
    type: string
  updater_name:
    type: string
