# values follow KnownActions in app/models/mod_action.rb, with types fixed to match what is actually logged
type: object
required:
  - id
  - creator_id
  - created_at
  - updated_at
  - action
  - values
properties:
  id:
    type: integer
  creator_id:
    type: integer
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  action:
    $ref: "../enums/ModActionAction.yml"
  values:
    type: object
    description: |
      The values logged with the action. The keys depend on `action`.<br>
      Non-admins only see the keys listed for the action. Older entries may be missing keys.
oneOf:
  - title: admin_user_delete
    properties:
      action:
        type: string
        enum:
          - admin_user_delete
      values:
        type: object
        properties:
          user_id:
            type: integer
  - title: artist_delete
