type: object
required:
  - id
  - created_at
  - name
  - level
  - base_upload_limit
  - upload_karma
  - upload_karma_free
  - post_upload_count
  - post_update_count
  - note_update_count
  - is_banned
  - can_approve_posts
  - can_upload_free
  - level_string
  - avatar_id
  - has_cropped_avatar
properties:
  id:
    type: integer
  created_at:
    type: string
    format: date-time
  name:
    type: string
  level:
    $ref: "../enums/UserLevel.yml"
  base_upload_limit:
    type: integer
  upload_karma:
    type: integer
  upload_karma_free:
    type: boolean
  post_upload_count:
    type: integer
  post_update_count:
    type: integer
  note_update_count:
    type: integer
  is_banned:
    type: boolean
  can_approve_posts:
    type: boolean
  can_upload_free:
    type: boolean
  level_string:
    $ref: "../enums/UserLevelName.yml"
  avatar_id:
    type: integer
    nullable: true
  is_verified:
    type: boolean
  has_cropped_avatar:
    type: boolean
  last_logged_in_at:
    type: string
    format: date-time
    description: Only visible to Admin+.
