type: object
required:
  - id
  - source
  - rating
  - uploader_id
  - tag_string
  - status
  - post_id
  - created_at
  - updated_at
  - parent_id
  - md5
  - file_ext
  - file_size
  - image_width
  - image_height
  - description
  - processing_step
  - error_message
  - warning_messages
  - is_animated
  - duration
  - has_sound
  - locked_tags
  - locked_rating
  - as_pending
  - submitted_tag_string
  - processing_started_at
  - processed_at
  - requeued_at
  - uploader_name
  - duplicate_post_id
properties:
  id:
    type: integer
  source:
    type: string
  rating:
    $ref: "../enums/Rating.yml"
  uploader_id:
    type: integer
  tag_string:
    type: string
  status:
    type: string
    description: |
      Note: The "duplicate" status will be followed by the duplicate post's id, ex: "duplicate: 123"
    enum:
      - completed
      - duplicate
      - failed
      - processing
      - queued
      - pending
  backtrace:
    type: string
    nullable: true
    description: Only visible to Staff+.
  post_id:
    type: integer
    nullable: true
  md5_confirmation:
    type: string
    nullable: true
    deprecated: true
    description: Only visible to Staff+.
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
  parent_id:
    type: integer
    nullable: true
  md5:
    type: string
    nullable: true
  file_ext:
    type: string
    nullable: true
  file_size:
    type: integer
    nullable: true
  image_width:
    type: integer
    nullable: true
  image_height:
    type: integer
    nullable: true
  description:
    type: string
  processing_step:
    type: string
    nullable: true
    description: The step currently being processed.
    enum:
      - integrity
      - thumbnail
      - sound
      - post
      - null
  error_message:
    type: string
    nullable: true
  warning_messages:
    type: array
    items:
      type: string
  is_animated:
    type: boolean
  duration:
    type: string
    nullable: true
  has_sound:
    type: boolean
  locked_tags:
    type: string
    nullable: true
  locked_rating:
    type: boolean
  as_pending:
    type: boolean
  submitted_tag_string:
    type: string
    nullable: true
  processing_started_at:
    type: string
    format: date-time
    nullable: true
  processed_at:
    type: string
    format: date-time
    nullable: true
  requeued_at:
    type: string
    format: date-time
    nullable: true
  uploader_name:
    type: string
  duplicate_post_id:
    type: integer
    nullable: true