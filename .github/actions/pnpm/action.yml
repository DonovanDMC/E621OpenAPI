name: PNPM
description: Initialize PNPM, install dependencies, and set up caching.

inputs:
  ref:
    description: The git ref to check out. Defaults to actions/checkout's own default (the ref/sha that triggered the workflow).
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - uses: pnpm/action-setup@v2
      with:
        version: 10.20.0
    - name: Get store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
    - uses: actions/cache@v3
      name: Setup cache
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - name: Install Dependencies
      shell: bash
      run: pnpm i --frozen-lockfile --ignore-scripts
