name: Deploy Pages
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm
      - name: Build Webpack
        run: pnpm run build:webpack:production
      - uses: DonovanDMC/PagesDeployServer@master
        with:
          directory: dist
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
