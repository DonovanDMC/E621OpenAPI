name: Deploy Github Pages
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # A local composite action has to be resolved from the checked-out
      # filesystem before it can even run, so this first checkout (of
      # whatever the default ref is) just has to happen for
      # ./.github/actions/pnpm to be found at all. Its own internal checkout
      # then switches to the actual ref we want - that one has to be passed
      # through rather than checked out separately here, or it'll clobber
      # this with the default ref again (the commit that triggered the
      # workflow, i.e. the one from *before* the Update API Version bot
      # commit).
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Build Webpack
        run: pnpm run build:webpack:production
      - name: Upload Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
