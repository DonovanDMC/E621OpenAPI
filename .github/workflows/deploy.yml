name: Deploy Github Pages
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      commit:
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ./.github/actions/pnpm does its own checkout, which would otherwise
      # clobber this ref with the default one (the commit that triggered the
      # workflow, i.e. the one from *before* the Update API Version bot
      # commit) - so the ref has to be passed through to it instead of
      # checking out separately here.
      - uses: ./.github/actions/pnpm
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Build Webpack
        run: pnpm run build:webpack:production
      - name: Upload Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
