name: Publish Client

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Update NPM # needed for OIDC
        run: npm i -g npm@"^11.5"
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      # one version per commit on master, so every spec update gets its own release
      - name: Set Version
        id: version
        run: |
          VERSION="1.0.$(git rev-list --count HEAD)"
          npm version "$VERSION" --no-git-tag-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "e621-openapi@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.version.outputs.published != 'true'
        run: npm run build
      # done here since --ignore-scripts skips prepublishOnly
      - name: Stamp README
        if: steps.version.outputs.published != 'true'
        run: node scripts/stamp-readme.mjs
      - name: Publish
        if: steps.version.outputs.published != 'true'
        run: npm publish --access public --ignore-scripts
